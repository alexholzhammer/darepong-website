<svg viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cheers to the Governor Prinzip: Die Gruppe zählt reihum von 1 bis 21. Wer 21 sagt, trinkt und erfindet eine neue Regel für eine Zahl, dann beginnt die nächste Runde von vorn."><title>Cheers to the Governor – Prinzip</title><desc>Die Gruppe zählt reihum von 1 bis 21. Wer 21 sagt, trinkt und erfindet eine neue Regel für eine Zahl. Danach beginnt die nächste Runde wieder bei 1 – mit immer mehr Regeln.</desc><circle cx="300" cy="100" r="66" fill="none" stroke="#E1342B" stroke-width="2.5" stroke-dasharray="7 6"/><polyline points="362,84 369,100 353,103" fill="none" stroke="#E1342B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g fill="#0E0E10"><circle cx="300" cy="34" r="9"/><circle cx="357" cy="67" r="9"/><circle cx="357" cy="133" r="9"/><circle cx="300" cy="166" r="9"/><circle cx="243" cy="133" r="9"/><circle cx="243" cy="67" r="9"/></g><circle cx="300" cy="100" r="38" fill="#E1342B"/><text x="300" y="94" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="26" font-weight="700" fill="#fff">21</text><text x="300" y="116" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="9" font-weight="700" fill="#fff">trinken!</text><text x="120" y="40" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0E0E10">Reihum</text><text x="120" y="58" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="400" fill="#4A4A4F">1 → 21 zählen</text><text x="480" y="150" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0E0E10">Bei 21:</text><text x="480" y="168" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="400" fill="#4A4A4F">neue Regel ausdenken</text></svg>