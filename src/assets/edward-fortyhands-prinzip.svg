<svg viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Edward Fortyhands Prinzip: An jede Hand wird eine große Flasche geklebt. Die Hände sind unbenutzbar, bis beide Flaschen leer getrunken sind."><title>Edward Fortyhands – das Prinzip</title><desc>An jede Hand wird mit Klebeband eine große Flasche oder Dose geklebt. Beide Hände sind damit unbenutzbar – erst wenn beide Getränke leer sind, darf das Klebeband ab.</desc><g><rect x="150" y="60" width="40" height="96" rx="8" fill="#E1342B" stroke="#0E0E10" stroke-width="1.8"/><rect x="162" y="34" width="16" height="28" fill="#E1342B" stroke="#0E0E10" stroke-width="1.4"/><rect x="160" y="26" width="20" height="10" rx="2" fill="#0E0E10"/><rect x="146" y="92" width="48" height="14" fill="#C9C9C9" stroke="#0E0E10" stroke-width="1.2"/><rect x="146" y="118" width="48" height="14" fill="#C9C9C9" stroke="#0E0E10" stroke-width="1.2"/><circle cx="170" cy="170" r="16" fill="#FFF7E3" stroke="#0E0E10" stroke-width="1.6"/><text x="170" y="170" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13">✋</text></g><g><rect x="410" y="60" width="40" height="96" rx="8" fill="#E1342B" stroke="#0E0E10" stroke-width="1.8"/><rect x="422" y="34" width="16" height="28" fill="#E1342B" stroke="#0E0E10" stroke-width="1.4"/><rect x="420" y="26" width="20" height="10" rx="2" fill="#0E0E10"/><rect x="406" y="92" width="48" height="14" fill="#C9C9C9" stroke="#0E0E10" stroke-width="1.2"/><rect x="406" y="118" width="48" height="14" fill="#C9C9C9" stroke="#0E0E10" stroke-width="1.2"/><circle cx="430" cy="170" r="16" fill="#FFF7E3" stroke="#0E0E10" stroke-width="1.6"/><text x="430" y="170" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13">🤚</text></g><text x="300" y="80" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0E0E10">Klebeband</text><text x="300" y="104" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#E1342B">+</text><text x="300" y="150" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#4A4A4F">Hände unbenutzbar,</text><text x="300" y="168" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#4A4A4F">bis beide leer sind</text></svg>