<svg viewBox="0 0 600 190" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cheers to the Governor Beispielregeln: 7 und 14 werden vertauscht, eine Zahl wird durch ein Wort ersetzt, und zwei Zahlen auf einmal drehen die Zählrichtung um."><title>Cheers to the Governor – Beispielregeln</title><desc>Beliebte Zusatzregeln: 7 und 14 werden vertauscht, eine bestimmte Zahl wird durch ein Wort ersetzt, und wer zwei Zahlen auf einmal sagt, dreht die Richtung um.</desc><rect x="14" y="24" width="180" height="142" rx="14" fill="#fff" stroke="#0E0E10" stroke-width="1.6"/><text x="104" y="58" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#E1342B">7 ⇄ 14</text><text x="104" y="104" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0E0E10">Vertauschen</text><text x="104" y="128" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#4A4A4F">Wer 7 dran ist, sagt 14</text><text x="104" y="144" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#4A4A4F">– und umgekehrt</text><rect x="210" y="24" width="180" height="142" rx="14" fill="#fff" stroke="#0E0E10" stroke-width="1.6"/><text x="300" y="58" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#E1342B">5 → „Prost“</text><text x="300" y="104" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0E0E10">Wort statt Zahl</text><text x="300" y="128" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#4A4A4F">Eine Zahl wird durch</text><text x="300" y="144" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#4A4A4F">ein Wort ersetzt</text><rect x="406" y="24" width="180" height="142" rx="14" fill="#fff" stroke="#0E0E10" stroke-width="1.6"/><text x="496" y="58" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#E1342B">↺</text><text x="496" y="104" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0E0E10">Richtungswechsel</text><text x="496" y="128" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#4A4A4F">Zwei Zahlen auf einmal</text><text x="496" y="144" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#4A4A4F">dreht die Richtung um</text></svg>