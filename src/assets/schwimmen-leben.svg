<svg viewBox="0 0 600 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schwimmen Leben-System: Jeder startet mit drei Leben. Wer eine Runde verliert, gibt ein Leben ab. Sind alle drei weg, schwimmt der Spieler. Verliert er erneut, scheidet er aus und trinkt."><title>Schwimmen – das Leben-System</title><desc>Jeder startet mit drei Leben. Wer die niedrigste Hand hat, verliert ein Leben. Sind alle drei Leben weg, schwimmt der Spieler. Verliert er dann noch einmal, geht er unter, scheidet aus und trinkt.</desc><rect x="20" y="46" width="150" height="100" rx="14" fill="#fff" stroke="#0E0E10" stroke-width="1.6"/><text x="95" y="70" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0E0E10">Start</text><g><circle cx="68" cy="100" r="10" fill="#E1342B"/><circle cx="95" cy="100" r="10" fill="#E1342B"/><circle cx="122" cy="100" r="10" fill="#E1342B"/></g><text x="95" y="132" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#4A4A4F">3 Leben</text><polyline points="178,96 206,96" fill="none" stroke="#E1342B" stroke-width="2.5"/><polyline points="200,91 206,96 200,101" fill="none" stroke="#E1342B" stroke-width="2.5"/><rect x="214" y="46" width="150" height="100" rx="14" fill="#fff" stroke="#0E0E10" stroke-width="1.6"/><text x="289" y="70" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0E0E10">Verlieren</text><g><circle cx="262" cy="100" r="10" fill="#E1342B"/><circle cx="289" cy="100" r="10" fill="#E1342B"/><circle cx="316" cy="100" r="10" fill="none" stroke="#B8B8B8" stroke-width="2"/></g><text x="289" y="132" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#4A4A4F">Leben abgeben</text><polyline points="372,96 400,96" fill="none" stroke="#E1342B" stroke-width="2.5"/><polyline points="394,91 400,96 394,101" fill="none" stroke="#E1342B" stroke-width="2.5"/><rect x="408" y="46" width="172" height="100" rx="14" fill="#fff" stroke="#E1342B" stroke-width="2.4"/><text x="494" y="70" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#E1342B">Schwimmt → raus</text><g><circle cx="468" cy="100" r="10" fill="none" stroke="#B8B8B8" stroke-width="2"/><circle cx="494" cy="100" r="10" fill="none" stroke="#B8B8B8" stroke-width="2"/><circle cx="520" cy="100" r="10" fill="none" stroke="#B8B8B8" stroke-width="2"/></g><text x="494" y="132" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#4A4A4F">noch 1 Leben, dann trinken</text><text x="300" y="166" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#4A4A4F">Als Trinkspiel: Wer untergeht, trinkt – oder bei jedem verlorenen Leben ein Schluck.</text></svg>