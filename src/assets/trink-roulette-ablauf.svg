<svg viewBox="0 0 600 130" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Trink-Roulette Ablauf in vier Schritten: nummerierte Shot-Gläser befüllen, das Rad oder die Kugel drehen, abwarten wo der Zeiger stehen bleibt, und das getroffene Glas austrinken."><title>Trink-Roulette Ablauf in 4 Schritten</title><desc>Trink-Roulette: Gläser befüllen, Rad oder Kugel drehen, abwarten wo der Zeiger landet, das getroffene Glas austrinken.</desc><rect x="8" y="20" width="128" height="92" rx="12" fill="#fff" stroke="#0E0E10" stroke-width="1.6"/><circle cx="34" cy="50" r="15" fill="#E1342B"/><text x="34" y="50" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="16" font-weight="700" fill="#fff">1</text><text x="56" y="44" text-anchor="start" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="700" fill="#0E0E10">Befüllen</text><text x="56" y="64" text-anchor="start" dominant-baseline="central" font-family="sans-serif" font-size="10" font-weight="400" fill="#4A4A4F">Gläser füllen</text><polyline points="140,66 160,66" fill="none" stroke="#E1342B" stroke-width="2.5"/><polyline points="154,61 160,66 154,71" fill="none" stroke="#E1342B" stroke-width="2.5"/><rect x="156" y="20" width="128" height="92" rx="12" fill="#fff" stroke="#0E0E10" stroke-width="1.6"/><circle cx="182" cy="50" r="15" fill="#E1342B"/><text x="182" y="50" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="16" font-weight="700" fill="#fff">2</text><text x="204" y="44" text-anchor="start" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="700" fill="#0E0E10">Drehen</text><text x="204" y="64" text-anchor="start" dominant-baseline="central" font-family="sans-serif" font-size="10" font-weight="400" fill="#4A4A4F">Rad / Kugel</text><polyline points="288,66 308,66" fill="none" stroke="#E1342B" stroke-width="2.5"/><polyline points="302,61 308,66 302,71" fill="none" stroke="#E1342B" stroke-width="2.5"/><rect x="304" y="20" width="128" height="92" rx="12" fill="#fff" stroke="#0E0E10" stroke-width="1.6"/><circle cx="330" cy="50" r="15" fill="#E1342B"/><text x="330" y="50" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="16" font-weight="700" fill="#fff">3</text><text x="352" y="44" text-anchor="start" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="700" fill="#0E0E10">Landen</text><text x="352" y="64" text-anchor="start" dominant-baseline="central" font-family="sans-serif" font-size="10" font-weight="400" fill="#4A4A4F">Zeiger zeigt Glas</text><polyline points="436,66 456,66" fill="none" stroke="#E1342B" stroke-width="2.5"/><polyline points="450,61 456,66 450,71" fill="none" stroke="#E1342B" stroke-width="2.5"/><rect x="452" y="20" width="128" height="92" rx="12" fill="#fff" stroke="#0E0E10" stroke-width="1.6"/><circle cx="478" cy="50" r="15" fill="#E1342B"/><text x="478" y="50" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="16" font-weight="700" fill="#fff">4</text><text x="500" y="44" text-anchor="start" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="700" fill="#0E0E10">Trinken</text><text x="500" y="64" text-anchor="start" dominant-baseline="central" font-family="sans-serif" font-size="10" font-weight="400" fill="#4A4A4F">Glas leeren</text></svg>