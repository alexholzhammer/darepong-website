<svg viewBox="0 0 600 190" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Wasserfall Prinzip: Alle beginnen gleichzeitig zu trinken. Der Startspieler darf zuerst absetzen, jeder weitere erst, wenn sein Vordermann aufgehört hat. Der Letzte trinkt am längsten."><title>Wasserfall – das Prinzip</title><desc>Alle beginnen gleichzeitig zu trinken. Der Startspieler darf als Erster absetzen; jeder weitere erst, wenn der Vordermann aufgehört hat. So entsteht ein Wasserfall – der Letzte trinkt am längsten.</desc><g font-family="sans-serif"><g><circle cx="70" cy="48" r="20" fill="#E1342B"/><text x="70" y="48" text-anchor="middle" dominant-baseline="central" font-size="18">🍺</text><rect x="58" y="78" width="24" height="26" rx="4" fill="#1F6FB2" opacity="0.85"/><text x="70" y="124" text-anchor="middle" font-size="10" font-weight="700" fill="#0E0E10">Start</text></g><g><circle cx="180" cy="48" r="20" fill="#0E0E10"/><text x="180" y="48" text-anchor="middle" dominant-baseline="central" font-size="18">🍺</text><rect x="168" y="78" width="24" height="44" rx="4" fill="#1F6FB2" opacity="0.85"/></g><g><circle cx="290" cy="48" r="20" fill="#0E0E10"/><text x="290" y="48" text-anchor="middle" dominant-baseline="central" font-size="18">🍺</text><rect x="278" y="78" width="24" height="60" rx="4" fill="#1F6FB2" opacity="0.85"/></g><g><circle cx="400" cy="48" r="20" fill="#0E0E10"/><text x="400" y="48" text-anchor="middle" dominant-baseline="central" font-size="18">🍺</text><rect x="388" y="78" width="24" height="76" rx="4" fill="#1F6FB2" opacity="0.85"/></g><g><circle cx="510" cy="48" r="20" fill="#E1342B"/><text x="510" y="48" text-anchor="middle" dominant-baseline="central" font-size="18">🍺</text><rect x="498" y="78" width="24" height="92" rx="4" fill="#1F6FB2"/><text x="510" y="182" text-anchor="middle" font-size="10" font-weight="700" fill="#E1342B">am längsten</text></g></g><g stroke="#4A4A4F" stroke-width="1.6" fill="none"><polyline points="96,48 154,48"/><polyline points="148,44 154,48 148,52"/><polyline points="206,48 264,48"/><polyline points="258,44 264,48 258,52"/><polyline points="316,48 374,48"/><polyline points="368,44 374,48 368,52"/><polyline points="426,48 484,48"/><polyline points="478,44 484,48 478,52"/></g><text x="300" y="14" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#4A4A4F">absetzen erst, wenn der Vordermann aufhört →</text></svg>