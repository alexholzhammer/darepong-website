<svg viewBox="0 0 600 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Looping Louie Aufbau: In der Mitte dreht sich Louie im Flugzeug an einem Arm. Rundherum haben bis zu vier Spieler je eine Basis mit drei Hühnern und einem Hebel, mit dem sie Louie hochschlagen.">
  <title>Looping Louie – Aufbau</title>
  <desc>In der Tischmitte dreht sich die Figur Louie im Flugzeug an einem rotierenden Arm. Rundherum sitzen bis zu vier Spieler, jeder mit einer Basis aus drei Hühnern und einem Hebel. Mit dem Hebel schlägt man Louie im richtigen Moment hoch, damit er die eigenen Hühner verschont und stattdessen die der Mitspieler abräumt. Wer als Letzter noch ein Huhn hat, gewinnt.</desc>
  <text x="300" y="26" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#0E0E10">Looping Louie – Aufbau (bis 4 Spieler)</text>
  <!-- rotation circle -->
  <circle cx="300" cy="180" r="92" fill="none" stroke="#A8A8AE" stroke-width="1.5" stroke-dasharray="5 5"/>
  <path d="M300 88 A92 92 0 0 1 392 180" fill="none" stroke="#0E0E10" stroke-width="2" marker-end="url(#a3)"/>
  <defs><marker id="a3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#0E0E10"/></marker></defs>
  <!-- Louie center -->
  <circle cx="300" cy="180" r="30" fill="#F2B829" stroke="#0E0E10" stroke-width="2"/>
  <text x="300" y="184" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0E0E10">Louie</text>
  <!-- 4 bases: top, right, bottom, left -->
  <g font-family="sans-serif" font-size="11" font-weight="700" fill="#0E0E10">
    <!-- top -->
    <g><rect x="255" y="48" width="90" height="30" rx="6" fill="#fff" stroke="#0E0E10" stroke-width="1.5"/>
      <circle cx="270" cy="63" r="5" fill="#C62828"/><circle cx="285" cy="63" r="5" fill="#C62828"/><circle cx="300" cy="63" r="5" fill="#C62828"/>
      <text x="330" y="67" font-size="10">Hebel</text></g>
    <!-- bottom -->
    <g><rect x="255" y="282" width="90" height="30" rx="6" fill="#fff" stroke="#0E0E10" stroke-width="1.5"/>
      <circle cx="270" cy="297" r="5" fill="#C62828"/><circle cx="285" cy="297" r="5" fill="#C62828"/><circle cx="300" cy="297" r="5" fill="#C62828"/>
      <text x="330" y="301" font-size="10">Hebel</text></g>
    <!-- left -->
    <g><rect x="70" y="165" width="90" height="30" rx="6" fill="#fff" stroke="#0E0E10" stroke-width="1.5"/>
      <circle cx="85" cy="180" r="5" fill="#C62828"/><circle cx="100" cy="180" r="5" fill="#C62828"/><circle cx="115" cy="180" r="5" fill="#C62828"/>
      <text x="135" y="184" font-size="10">Hebel</text></g>
    <!-- right -->
    <g><rect x="440" y="165" width="90" height="30" rx="6" fill="#fff" stroke="#0E0E10" stroke-width="1.5"/>
      <circle cx="455" cy="180" r="5" fill="#C62828"/><circle cx="470" cy="180" r="5" fill="#C62828"/><circle cx="485" cy="180" r="5" fill="#C62828"/>
      <text x="505" y="184" font-size="10">Hebel</text></g>
  </g>
  <text x="300" y="320" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6B6B72">3 Hühner pro Basis · für jedes verlorene Huhn wird getrunken</text>
</svg>
