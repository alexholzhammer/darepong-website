<svg viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schiffe versenken Flotte: ein Schlachtschiff über fünf Felder, zwei Kreuzer über vier Felder, drei Zerstörer über drei Felder und vier U-Boote über zwei Felder."><title>Schiffe versenken – die Flotte</title><desc>Eine typische Flotte besteht aus einem Schlachtschiff über fünf Felder, zwei Kreuzern über je vier Felder, drei Zerstörern über je drei Felder und vier U-Booten über je zwei Felder.</desc><g font-family="sans-serif"><text x="30" y="40" font-size="13" font-weight="700" fill="#0E0E10">Schlachtschiff</text><rect x="220" y="28" width="130" height="22" rx="4" fill="#7A7A7A" stroke="#0E0E10" stroke-width="1.4"/><g stroke="#0E0E10" stroke-width="1"><line x1="246" y1="28" x2="246" y2="50"/><line x1="272" y1="28" x2="272" y2="50"/><line x1="298" y1="28" x2="298" y2="50"/><line x1="324" y1="28" x2="324" y2="50"/></g><text x="368" y="40" font-size="12" font-weight="700" fill="#E1342B">×1 · 5 Felder</text><text x="30" y="80" font-size="13" font-weight="700" fill="#0E0E10">Kreuzer</text><rect x="220" y="68" width="104" height="22" rx="4" fill="#7A7A7A" stroke="#0E0E10" stroke-width="1.4"/><g stroke="#0E0E10" stroke-width="1"><line x1="246" y1="68" x2="246" y2="90"/><line x1="272" y1="68" x2="272" y2="90"/><line x1="298" y1="68" x2="298" y2="90"/></g><text x="368" y="80" font-size="12" font-weight="700" fill="#E1342B">×2 · 4 Felder</text><text x="30" y="120" font-size="13" font-weight="700" fill="#0E0E10">Zerstörer</text><rect x="220" y="108" width="78" height="22" rx="4" fill="#7A7A7A" stroke="#0E0E10" stroke-width="1.4"/><g stroke="#0E0E10" stroke-width="1"><line x1="246" y1="108" x2="246" y2="130"/><line x1="272" y1="108" x2="272" y2="130"/></g><text x="368" y="120" font-size="12" font-weight="700" fill="#E1342B">×3 · 3 Felder</text><text x="30" y="160" font-size="13" font-weight="700" fill="#0E0E10">U-Boot</text><rect x="220" y="148" width="52" height="22" rx="4" fill="#7A7A7A" stroke="#0E0E10" stroke-width="1.4"/><line x1="246" y1="148" x2="246" y2="170" stroke="#0E0E10" stroke-width="1"/><text x="368" y="160" font-size="12" font-weight="700" fill="#E1342B">×4 · 2 Felder</text></g><text x="300" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#4A4A4F">Tipp: Bei „Schnäpse versenken“ steht für jedes Schiffsfeld ein kleiner Shot bereit.</text></svg>