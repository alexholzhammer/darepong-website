<svg viewBox="0 0 600 140" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ablauf einer Beer-Pong-Runde in fünf Schritten: Werfen, Treffer, Becher leeren, Becher entfernen, Gegner ist am Zug."><title>Beer Pong Ablauf in 5 Schritten</title><desc>Ablauf einer Beer-Pong-Runde in fünf Schritten: Werfen, Treffer, Becher leeren, Becher entfernen, Gegner ist am Zug.</desc><rect x="10" y="18" width="100" height="104" rx="12" fill="#fff" stroke="#0E0E10" stroke-width="1.6"/><circle cx="60" cy="50" r="17" fill="#E1342B"/><text x="60" y="50" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="19" font-weight="700" fill="#fff">1</text><text x="60" y="90" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="700" fill="#0E0E10">Werfen</text><rect x="130" y="18" width="100" height="104" rx="12" fill="#fff" stroke="#0E0E10" stroke-width="1.6"/><circle cx="180" cy="50" r="17" fill="#E1342B"/><text x="180" y="50" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="19" font-weight="700" fill="#fff">2</text><text x="180" y="90" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="700" fill="#0E0E10">Treffer</text><rect x="250" y="18" width="100" height="104" rx="12" fill="#fff" stroke="#0E0E10" stroke-width="1.6"/><circle cx="300" cy="50" r="17" fill="#E1342B"/><text x="300" y="50" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="19" font-weight="700" fill="#fff">3</text><text x="300" y="90" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="700" fill="#0E0E10">Becher leeren</text><rect x="370" y="18" width="100" height="104" rx="12" fill="#fff" stroke="#0E0E10" stroke-width="1.6"/><circle cx="420" cy="50" r="17" fill="#E1342B"/><text x="420" y="50" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="19" font-weight="700" fill="#fff">4</text><text x="420" y="90" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="700" fill="#0E0E10">Becher raus</text><rect x="490" y="18" width="100" height="104" rx="12" fill="#fff" stroke="#0E0E10" stroke-width="1.6"/><circle cx="540" cy="50" r="17" fill="#E1342B"/><text x="540" y="50" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="19" font-weight="700" fill="#fff">5</text><text x="540" y="90" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="700" fill="#0E0E10">Gegner wirft</text><polyline points="114,70 126,70" fill="none" stroke="#E1342B" stroke-width="2.5"/><polyline points="120,65 126,70 120,75" fill="none" stroke="#E1342B" stroke-width="2.5"/><polyline points="234,70 246,70" fill="none" stroke="#E1342B" stroke-width="2.5"/><polyline points="240,65 246,70 240,75" fill="none" stroke="#E1342B" stroke-width="2.5"/><polyline points="354,70 366,70" fill="none" stroke="#E1342B" stroke-width="2.5"/><polyline points="360,65 366,70 360,75" fill="none" stroke="#E1342B" stroke-width="2.5"/><polyline points="474,70 486,70" fill="none" stroke="#E1342B" stroke-width="2.5"/><polyline points="480,65 486,70 480,75" fill="none" stroke="#E1342B" stroke-width="2.5"/></svg>
