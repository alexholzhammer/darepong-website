<svg viewBox="0 0 600 190" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="UNO Trinkspiel Sonderstrafen: UNO zu rufen vergessen kostet drei Schlucke, eine falsche oder unpassende Karte zu legen kostet zwei Schlucke, und das Spiel mit einer Aktionskarte zu beenden lässt alle anderen trinken."><title>UNO Trinkspiel – Sonderstrafen</title><desc>Beliebte Zusatzstrafen: UNO vergessen kostet drei Schlucke, eine falsche Karte kostet zwei Schlucke, und wer mit einer Aktionskarte gewinnt, lässt alle anderen trinken.</desc><rect x="14" y="24" width="180" height="142" rx="14" fill="#fff" stroke="#E1342B" stroke-width="2.2"/><circle cx="104" cy="64" r="22" fill="#E1342B"/><text x="104" y="64" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="18" font-weight="700" fill="#fff">3</text><text x="104" y="108" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0E0E10">„UNO!“ vergessen</text><text x="104" y="132" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#4A4A4F">3 Schlucke – wer die</text><text x="104" y="148" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#4A4A4F">vorletzte Karte legt</text><rect x="210" y="24" width="180" height="142" rx="14" fill="#fff" stroke="#0E0E10" stroke-width="1.6"/><circle cx="300" cy="64" r="22" fill="#0E0E10"/><text x="300" y="64" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="18" font-weight="700" fill="#fff">2</text><text x="300" y="108" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0E0E10">Falsche Karte</text><text x="300" y="132" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#4A4A4F">2 Schlucke – falsche</text><text x="300" y="148" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#4A4A4F">Farbe oder Zahl gelegt</text><rect x="406" y="24" width="180" height="142" rx="14" fill="#fff" stroke="#0E0E10" stroke-width="1.6"/><circle cx="496" cy="64" r="22" fill="#E1342B"/><text x="496" y="64" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="15" font-weight="700" fill="#fff">ALLE</text><text x="496" y="108" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0E0E10">Sieg mit Aktionskarte</text><text x="496" y="132" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#4A4A4F">letzte Karte ist eine</text><text x="496" y="148" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#4A4A4F">Aktionskarte? Alle trinken</text></svg>