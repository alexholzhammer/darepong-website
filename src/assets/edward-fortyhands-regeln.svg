<svg viewBox="0 0 600 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Edward Fortyhands Regeln: Die Hände dürfen erst nach dem Austrinken befreit werden, Toilettengang und Handy sind tabu, und gerechte Mengen sorgen für faires Spiel."><title>Edward Fortyhands – die Spielregeln</title><desc>Die Hände dürfen erst nach dem Austrinken befreit werden, Toilettengang und Handy sind währenddessen tabu, und alle starten mit gleicher Menge.</desc><rect x="14" y="24" width="180" height="132" rx="14" fill="#fff" stroke="#E1342B" stroke-width="2.2"/><text x="104" y="58" text-anchor="middle" font-family="sans-serif" font-size="26">🚫</text><text x="104" y="96" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0E0E10">Kein Abkleben</text><text x="104" y="120" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#4A4A4F">Erst wenn beide</text><text x="104" y="136" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#4A4A4F">Flaschen leer sind</text><rect x="210" y="24" width="180" height="132" rx="14" fill="#fff" stroke="#0E0E10" stroke-width="1.6"/><text x="300" y="58" text-anchor="middle" font-family="sans-serif" font-size="26">📵</text><text x="300" y="96" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0E0E10">Hände tabu</text><text x="300" y="120" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#4A4A4F">Kein Handy, keine Tür,</text><text x="300" y="136" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#4A4A4F">keine Toilette ohne Hilfe</text><rect x="406" y="24" width="180" height="132" rx="14" fill="#fff" stroke="#0E0E10" stroke-width="1.6"/><text x="496" y="58" text-anchor="middle" font-family="sans-serif" font-size="26">⚖️</text><text x="496" y="96" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0E0E10">Faire Menge</text><text x="496" y="120" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#4A4A4F">Alle gleich viel –</text><text x="496" y="136" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#4A4A4F">leichtes Bier empfohlen</text></svg>