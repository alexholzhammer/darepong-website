<svg viewBox="0 0 600 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nageln Technik: Geschlagen werden darf nur mit der schmalen, spitzen Seite des Hammers. Die breite flache Seite ist verboten. Pro Zug ist genau ein Schlag erlaubt."><title>Nageln Technik – nur die spitze Hammerseite</title><desc>Geschlagen wird ausschließlich mit der schmalen, spitzen Seite des Hammers. Die breite, flache Seite ist verboten. Pro Zug ist genau ein Schlag erlaubt.</desc><rect x="200" y="36" width="150" height="26" rx="5" fill="#5A5A5A" stroke="#0E0E10" stroke-width="1.6"/><path d="M350 36 l34 6 l0 14 l-34 6 z" fill="#5A5A5A" stroke="#0E0E10" stroke-width="1.6"/><rect x="150" y="40" width="52" height="18" rx="3" fill="#5A5A5A" stroke="#0E0E10" stroke-width="1.6"/><circle cx="160" cy="14" r="11" fill="#E1342B"/><path d="M156 10l8 8M164 10l-8 8" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/><text x="176" y="14" text-anchor="start" dominant-baseline="central" font-family="sans-serif" font-size="11" font-weight="700" fill="#E1342B">flache Seite … verboten!</text><text x="378" y="20" text-anchor="end" font-family="sans-serif" font-size="11" font-weight="700" fill="#2E7D32">spitze Seite ✓</text><line x1="367" y1="64" x2="367" y2="92" stroke="#7A7A7A" stroke-width="3" stroke-linecap="round"/><polyline points="362,68 367,90 372,68" fill="none" stroke="#E1342B" stroke-width="2"/><rect x="430" y="70" width="150" height="92" fill="#E8D5A8" stroke="#0E0E10" stroke-width="1.8"/><ellipse cx="505" cy="70" rx="75" ry="14" fill="#E8D5A8" stroke="#0E0E10" stroke-width="1.8"/><line x1="505" y1="56" x2="505" y2="38" stroke="#7A7A7A" stroke-width="3" stroke-linecap="round"/><circle cx="505" cy="37" r="4" fill="#E1342B"/><text x="505" y="118" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#0E0E10">1 Schlag pro Zug</text><text x="290" y="150" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0E0E10">Nur mit der spitzen Seite schlagen –</text><text x="290" y="170" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0E0E10">das macht den Reiz aus.</text></svg>