<svg viewBox="0 0 600 130" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ablauf von Wahrheit oder Pflicht: Spieler wählt Wahrheit oder Pflicht, beantwortet die Frage oder erfüllt die Aufgabe, sonst wird getrunken."><title>Wahrheit oder Pflicht – Ablauf</title><desc>Ablauf von Wahrheit oder Pflicht: Spieler wählt Wahrheit oder Pflicht, beantwortet die Frage oder erfüllt die Aufgabe, sonst wird getrunken.</desc><rect x="4" y="20" width="186" height="92" rx="12" fill="#fff" stroke="#0E0E10" stroke-width="1.6"/><circle cx="28" cy="48" r="15" fill="#E1342B"/><text x="28" y="48" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="16" font-weight="700" fill="#fff">1</text><text x="48" y="44" text-anchor="start" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="700" fill="#0E0E10">Wählen</text><text x="48" y="64" text-anchor="start" dominant-baseline="central" font-family="sans-serif" font-size="10" font-weight="400" fill="#4A4A4F">Wahrheit / Pflicht</text><polyline points="194,66 206,66" fill="none" stroke="#E1342B" stroke-width="2.5"/><polyline points="200,61 206,66 200,71" fill="none" stroke="#E1342B" stroke-width="2.5"/><rect x="210" y="20" width="186" height="92" rx="12" fill="#fff" stroke="#0E0E10" stroke-width="1.6"/><circle cx="234" cy="48" r="15" fill="#E1342B"/><text x="234" y="48" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="16" font-weight="700" fill="#fff">2</text><text x="254" y="44" text-anchor="start" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="700" fill="#0E0E10">Erfüllen</text><text x="254" y="64" text-anchor="start" dominant-baseline="central" font-family="sans-serif" font-size="10" font-weight="400" fill="#4A4A4F">Frage oder Aufgabe</text><polyline points="400,66 412,66" fill="none" stroke="#E1342B" stroke-width="2.5"/><polyline points="406,61 412,66 406,71" fill="none" stroke="#E1342B" stroke-width="2.5