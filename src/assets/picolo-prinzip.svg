<svg viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Picolo Prinzip: Alle Namen werden in die App eingegeben, dann wandert das Handy in der Runde herum und stellt jedem Spieler persönliche Aufgaben und Trink-Challenges."><title>Picolo Prinzip</title><desc>Alle Spielernamen werden in die App eingegeben. Das Handy wandert reihum und stellt jedem Spieler persönliche Aufgaben und Trink-Challenges – ganz ohne weiteres Material.</desc><rect x="60" y="30" width="120" height="150" rx="18" fill="#0E0E10"/><rect x="70" y="44" width="100" height="122" rx="6" fill="#fff"/><rect x="70" y="44" width="100" height="26" rx="6" fill="#E1342B"/><text x="120" y="57" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" font-weight="700" fill="#fff">Picolo</text><rect x="80" y="80" width="80" height="14" rx="3" fill="#FFF7E3" stroke="#0E0E10" stroke-width="1"/><text x="86" y="87" font-family="sans-serif" font-size="9" font-weight="400" fill="#4A4A4F">Anna</text><rect x="80" y="100" width="80" height="14" rx="3" fill="#FFF7E3" stroke="#0E0E10" stroke-width="1"/><text x="86" y="107" font-family="sans-serif" font-size="9" font-weight="400" fill="#4A4A4F">Ben</text><rect x="80" y="120" width="80" height="14" rx="3" fill="#FFF7E3" stroke="#0E0E10" stroke-width="1"/><text x="86" y="127" font-family="sans-serif" font-size="9" font-weight="400" fill="#4A4A4F">Clara</text><rect x="80" y="144" width="80" height="14" rx="3" fill="#E1342B"/><text x="120" y="151" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="9" font-weight="700" fill="#fff">+ Spieler</text><polyline points="200,100 232,100" fill="none" stroke="#E1342B" stroke-width="2.5"/><polyline points="226,95 232,100 226,105" fill="none" stroke="#E1342B" stroke-width="2.5"/><rect x="248" y="58" width="320" height="84" rx="14" fill="#FFF7E3" stroke="#0E0E10" stroke-width="1.6"/><path d="M268 142 l0 18 l16 -18 z" fill="#FFF7E3" stroke="#0E0E10" stroke-width="1.6"/><rect x="266" y="140" width="22" height="6" fill="#FFF7E3"/><text x="408" y="84" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#E1342B">Aufgabe für Anna</text><text x="408" y="108" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="400" fill="#0E0E10">„Trink mit dem Spieler links</text><text x="408" y="126" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="400" fill="#0E0E10">von dir – oder beide 2 Schlucke.“</text><text x="300" y="184" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#4A4A4F">Handy reihum geben · App liest die nächste Challenge vor</text></svg>