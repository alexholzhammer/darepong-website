<svg viewBox="0 0 600 210" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Kartenwerte bei 17 und 4: Das Ass zählt 1 oder 11 Punkte, Bildkarten Bube Dame König zählen je 10 Punkte, alle Zahlenkarten zählen ihren Augenwert."><title>17 und 4 Kartenwerte</title><desc>Das Ass zählt wahlweise 1 oder 11 Punkte, Bildkarten (Bube, Dame, König) zählen je 10 Punkte und Zahlenkarten zählen ihren aufgedruckten Augenwert.</desc><rect x="70" y="26" width="84" height="118" rx="10" fill="#fff" stroke="#0E0E10" stroke-width="1.8"/><text x="82" y="46" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#E1342B">A</text><text x="112" y="92" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="40" font-weight="700" fill="#E1342B">A</text><text x="112" y="166" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0E0E10">Ass</text><text x="112" y="186" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="400" fill="#4A4A4F">1 oder 11</text><rect x="258" y="26" width="84" height="118" rx="10" fill="#fff" stroke="#0E0E10" stroke-width="1.8"/><text x="270" y="46" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#0E0E10">K</text><text x="300" y="92" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="40" font-weight="700" fill="#0E0E10">K</text><text x="300" y="166" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0E0E10">Bube / Dame / König</text><text x="300" y="186" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="400" fill="#4A4A4F">je 10</text><rect x="446" y="26" width="84" height="118" rx="10" fill="#fff" stroke="#0E0E10" stroke-width="1.8"/><text x="458" y="46" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#E1342B">7</text><text x="488" y="92" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="40" font-weight="700" fill="#E1342B">7</text><text x="488" y="166" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0E0E10">Zahlenkarte</text><text x="488" y="186" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="400" fill="#4A4A4F">= Augenwert (7)</text></svg>