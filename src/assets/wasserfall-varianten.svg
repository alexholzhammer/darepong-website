<svg viewBox="0 0 600 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Wasserfall Varianten: als eigenes Spiel mit Startspieler, als Ass-Regel beim King's Cup, oder mit frei wählbarer Trinkrichtung."><title>Wasserfall – beliebte Varianten</title><desc>Drei Varianten: Wasserfall als eigenes Spiel mit festem Startspieler, als Ass-Aktion beim King's Cup und mit frei wählbarer Trinkrichtung.</desc><rect x="14" y="24" width="180" height="132" rx="14" fill="#fff" stroke="#0E0E10" stroke-width="1.6"/><text x="104" y="58" text-anchor="middle" font-family="sans-serif" font-size="26">🍺</text><text x="104" y="96" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0E0E10">Eigenes Spiel</text><text x="104" y="120" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#4A4A4F">Fester Startspieler</text><text x="104" y="136" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#4A4A4F">gibt den Takt vor</text><rect x="210" y="24" width="180" height="132" rx="14" fill="#fff" stroke="#0E0E10" stroke-width="1.6"/><text x="300" y="58" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#E1342B">A</text><text x="300" y="96" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0E0E10">King’s-Cup-Regel</text><text x="300" y="120" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#4A4A4F">Wer ein Ass zieht,</text><text x="300" y="136" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#4A4A4F">startet den Wasserfall</text><rect x="406" y="24" width="180" height="132" rx="14" fill="#fff" stroke="#0E0E10" stroke-width="1.6"/><text x="496" y="58" text-anchor="middle" font-family="sans-serif" font-size="26">↔️</text><text x="496" y="96" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0E0E10">Richtung wählen</text><text x="496" y="120" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#4A4A4F">Startspieler bestimmt</text><text x="496" y="136" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#4A4A4F">links oder rechts herum</text></svg>