eline="central" font-family="sans-serif" font-size="16" font-weight="700" fill="#fff">3</text><text x="352" y="44" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="700" fill="#0E0E10">„Stopp!“</text><text x="352" y="60" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#4A4A4F">Gegner stellt</text><text x="352" y="74" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#4A4A4F">auf</text><rect x="452" y="20" width="128" height="92" rx="12" fill="#fff" stroke="#0E0E10" stroke-width="1.6"/><circle cx="478" cy="50" r="15" fill="#E1342B"/><text x="478" y="50" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="16" font-weight="700" fill="#fff">4</text><text x="500" y="44" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="700" fill="#0E0E10">Wechsel</text><text x="500" y="64" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#4A4A4F">Gegner wirft</text><polyline points="140,66 150,66" fill="none" stroke="#E1342B" stroke-width="2.5"/><polyline points="146,61 152,66 146,71" fill="none" stroke="#E1342B" stroke-width="2.5"/><polyline points="288,66 298,66" fill="none" stroke="#E1342B" stroke-width="2.5"/><polyline points="294,61 300,66 294,71" fill="none" stroke="#E1342B" stroke-width="2.5"/><polyline points="436,66 446,66" fill="none" stroke="#E1342B" stroke-width="2.5"/><polyline points="442,61 448,66 442,71" fill="none" stroke="#E1342B" stroke-width="2.5"/></svg>