<svg viewBox="0 0 600 130" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Rage Cage Ablauf: austrinken, den Ball in den leeren Becher treffen, sonst vom anderen Becher eingeholt werden und trinken."><title>Rage Cage Ablauf</title><desc>Rage Cage Ablauf: austrinken, den Ball in den leeren Becher treffen, sonst vom anderen Becher eingeholt werden und trinken.</desc><rect x="4" y="20" width="135" height="92" rx="12" fill="#fff" stroke="#0E0E10" stroke-width="1.6"/><circle cx="28" cy="48" r="15" fill="#E1342B"/><text x="28" y="48" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="16" font-weight="700" fill="#fff">1</text><text x="48" y="44" text-anchor="start" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="700" fill="#0E0E10">Austrinken</text><text x="48" y="64" text-anchor="start" dominant-baseline="central" font-family="sans-serif" font-size="10" font-weight="400" fill="#4A4A4F">Startbecher leeren</text><polyline points="143,66 155,66" fill="none" stroke="#E1342B" stroke-width="2.5"/><polyline points="149,61 155,66 149,71" fill="none" stroke="#E1342B" stroke-width="2.5"/><rect x="159" y="20" width="135" height="92" rx="12" fill="#fff" stroke="#0E0E10" stroke-width="1.6"/><circle cx="183" cy="48" r="15" fill="#E1342B"/><text x="183" y="48" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="16" font-weight="700" fill="#fff">2</text><text x="203" y="44" text-anchor="start" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="700" fill="#0E0E10">Treffen</text><text x="203" y="64" text-anchor="start" dominant-baseline="central" font-family="sans-serif" font-size="10" font-weight="400" fill="#4A4A4F">Ball in den Becher</text><polyline points="298,66 310,66" fill="none" stroke="#E1342B" stroke-width="2.5"/><polyline points="304,61 310,66 304,71" fill="none" stroke="#E1342B" stroke-width="2.5"/><rect x="314" y="20" width="135" height="92" rx="12" fill="#fff" stroke="#0E0E10" stroke-width="1.6"/><circle cx="338" cy="48" r="15" fill="#E1342B"/><text x="338" y="48" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="16" font-weight="700" fill="#fff">3</text><text x="358" y="44" text-anchor="start" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="700" fill="#0E0E10">Weitergeben</text><text x="358" y="64" text-anchor="start" dominant-baseline="central" font-family="sans-serif" font-size="10" font-weight="400" fill="#4A4A4F">nach links</text><polyline points="453,66 465,66" fill="none" stroke="#E1342B" stroke-width="2.5"/><polyline points="459,61 465,66 459,71" fill="none" stroke="#E1342B" stroke-width="2.5"/><rect x="469" y="20" width="135" height="92" rx="12" fill="#fff" stroke="#0E0E10" stroke-width="1.6"/><circle cx="493" cy="48" r="15" fill="#E1342B"/><text x="493" y="48" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="16" font-weight="700" fill="#fff">4</text><text x="513" y="44" text-anchor="start" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="700" fill="#0E0E10">Eingeholt?</text><text x="513" y="64" text-anchor="start" dominant-baseline="central" font-family="sans-serif" font-size="10" font-weight="400" fill="#4A4A4F">dann trinken</text></svg>
