f" font-size="12" font-weight="700" fill="#fff">4</text><text x="426" y="65" text-anchor="start" dominant-baseline="central" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#0E0E10">Becher raus</text><rect x="512" y="38" width="104" height="54" rx="10" fill="#ECE9E1" stroke="#0E0E10" stroke-width="1.6"/><circle cx="534" cy="65" r="11" fill="#E1342B"/><text x="534" y="65" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" font-weight="700" fill="#fff">5</text><text x="552" y="65" text-anchor="start" dominant-baseline="central" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#0E0E10">Gegner wirft</text><polyline points="116,65 130,65" fill="none" stroke="#E1342B" stroke-width="2"/><polyline points="125,61 130,65 125,69" fill="none" stroke="#E1342B" stroke-width="2"/><polyline points="242,65 256,65" fill="none" stroke="#E1342B" stroke-width="2"/><polyline points="251,61 256,65 251,69" fill="none" stroke="#E1342B" stroke-width="2"/><polyline points="368,65 382,65" fill="none" stroke="#E1342B" stroke-width="2"/><polyline points="377,61 382,65 377,69" fill="none" stroke="#E1342B" stroke-width="2"/><polyline points="494,65 508,65" fill="none" stroke="#E1342B" stroke-width="2"/><polyline points="503,61 508,65 503,69" fill="none" stroke="#E1342B" stroke-width="2"/></svg>
