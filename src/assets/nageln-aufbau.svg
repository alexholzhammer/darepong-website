<svg viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nageln Aufbau: ein aufrechter Baumstamm, in dessen Oberseite für jeden Spieler ein Nagel leicht angeschlagen ist, daneben ein Hammer."><title>Nageln Aufbau &amp; Material</title><desc>Ein aufrecht stehender Baumstamm, in dessen Oberseite für jeden Mitspieler ein Nagel leicht eingeschlagen ist. Daneben liegt der Hammer, mit dem reihum geschlagen wird.</desc><rect x="210" y="78" width="170" height="104" fill="#E8D5A8" stroke="#0E0E10" stroke-width="1.8"/><line x1="245" y1="86" x2="245" y2="182" stroke="#C9A227" stroke-width="1.2"/><line x1="300" y1="86" x2="300" y2="182" stroke="#C9A227" stroke-width="1.2"/><line x1="345" y1="86" x2="345" y2="182" stroke="#C9A227" stroke-width="1.2"/><ellipse cx="295" cy="78" rx="85" ry="20" fill="#E8D5A8" stroke="#0E0E10" stroke-width="1.8"/><ellipse cx="295" cy="78" rx="55" ry="12" fill="none" stroke="#C9A227" stroke-width="1.2"/><g stroke="#7A7A7A" stroke-width="2.4" stroke-linecap="round"><line x1="255" y1="76" x2="252" y2="58"/><line x1="285" y1="80" x2="283" y2="60"/><line x1="315" y1="78" x2="314" y2="56"/><line x1="340" y1="74" x2="339" y2="58"/></g><g fill="#E1342B"><circle cx="252" cy="57" r="4"/><circle cx="283" cy="59" r="4"/><circle cx="314" cy="55" r="4"/><circle cx="339" cy="57" r="4"/></g><text x="295" y="120" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0E0E10">Baumstamm</text><text x="295" y="40" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#4A4A4F">je 1 Nagel pro Spieler</text><g><rect x="446" y="150" width="96" height="12" rx="3" fill="#8A5A2B" stroke="#0E0E10" stroke-width="1.4" transform="rotate(-32 446 150)"/><rect x="430" y="92" width="20" height="40" rx="3" fill="#5A5A5A" stroke="#0E0E10" stroke-width="1.4" transform="rotate(-32 430 92)"/><path d="M455 84 l16 -10 l6 9 l-16 10 z" fill="#5A5A5A" stroke="#0E0E10" stroke-width="1.4"/></g><text x="498"