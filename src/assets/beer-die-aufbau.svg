<svg viewBox="0 0 600 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Beer Die Aufbau: ein quadratischer Tisch, an jeder Ecke ein Spieler mit Becher, zwei Teams sitzen sich diagonal gegenüber. Der Würfel wird im hohen Bogen über die Tischmitte auf die gegnerische Seite geworfen.">
  <title>Beer Die – Aufbau am quadratischen Tisch</title>
  <desc>Beim Beer Die sitzen vier Spieler an den Ecken eines quadratischen Tisches, je zwei bilden ein Team und sitzen sich diagonal gegenüber. Vor jedem Spieler steht ein Becher. Der Würfel wird im hohen Bogen über die Mitte auf die gegnerische Tischhälfte geworfen, die Gegner versuchen zu fangen.</desc>
  <text x="300" y="26" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#0E0E10">Beer Die – Aufbau (2 vs. 2 am Quadrattisch)</text>
  <!-- table as rotated square (diamond) -->
  <rect x="190" y="80" width="220" height="220" rx="10" fill="#E5E1D8" stroke="#0E0E10" stroke-width="2" transform="rotate(45 300 190)"/>
  <line x1="300" y1="48" x2="300" y2="332" stroke="#A8A8AE" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="300" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6B6B72">Höhenlinie</text>
  <!-- corners: top, right, bottom, left -->
  <g font-family="sans-serif" font-size="12" font-weight="700">
    <!-- top (Team A) -->
    <circle cx="300" cy="60" r="15" fill="#F2B829" stroke="#0E0E10" stroke-width="2"/><text x="300" y="64" text-anchor="middle" fill="#0E0E10">A1</text>
    <rect x="288" y="92" width="24" height="20" rx="4" fill="#fff" stroke="#0E0E10" stroke-width="1.5"/>
    <!-- bottom (Team A) -->
    <circle cx="300" cy="320" r="15" fill="#F2B829" stroke="#0E0E10" stroke-width="2"/><text x="300" y="324" text-anchor="middle" fill="#0E0E10">A2</text>
    <rect x="288" y="268" width="24" height="20" rx="4" fill="#fff" stroke="#0E0E10" stroke-width="1.5"/>
    <!-- left (Team B) -->
    <circle cx="170" cy="190" r="15" fill="#C62828" stroke="#0E0E10" stroke-width="2"/><text x="170" y="194" text-anchor="middle" fill="#fff">B1</text>
    <rect x="202" y="180" width="24" height="20" rx="4" fill="#fff" stroke="#0E0E10" stroke-width="1.5"/>
    <!-- right (Team B) -->
    <circle cx="430" cy="190" r="15" fill="#C62828" stroke="#0E0E10" stroke-width="2"/><text x="430" y="194" text-anchor="middle" fill="#fff">B2</text>
    <rect x="374" y="180" width="24" height="20" rx="4" fill="#fff" stroke="#0E0E10" stroke-width="1.5"/>
  </g>
  <!-- throw arc from A1 to B-side -->
  <path d="M300 78 Q360 120 416 178" fill="none" stroke="#0E0E10" stroke-width="2" stroke-dasharray="2 4" marker-end="url(#ar)"/>
  <defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#0E0E10"/></marker></defs>
  <text x="300" y="190" text-anchor="middle" font-family="sans-serif" font-size="0" fill="none"> </text>
</svg>
