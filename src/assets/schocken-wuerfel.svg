<svg viewBox="0 0 350 210" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Beim Schocken ist 1-1-1 der höchste Wurf, der Schock aus. Darunter folgen die übrigen Schock-Würfe, dann Generäle und Straßen."><title>Schocken – Schock aus (1-1-1)</title><desc>Beim Schocken ist 1-1-1 der höchste Wurf, der Schock aus. Darunter folgen die übrigen Schock-Würfe, dann Generäle und Straßen.</desc><rect x="40" y="55" width="80" height="80" rx="12.8" fill="#fff" stroke="#0E0E10" stroke-width="2"/><circle cx="80.0" cy="95.0" r="7.2" fill="#E1342B"/><rect x="135" y="55" width="80" height="80" rx="12.8" fill="#fff" stroke="#0E0E10" stroke-width="2"/><circle cx="175.0" cy="95.0" r="7.2" fill="#E1342B"/><rect x="230" y="55" width="80" height="80" rx="12.8" fill="#fff" stroke="#0E0E10" stroke-width="2"/><circle cx="270.0" cy="95.0" r="7.2" fill="#E1342B"/><text x="175" y="165" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="700" fill="#0E0E10">1-1-1 = „Schock aus“ – der höchste Wurf</text><text x="175" y="187" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" font-weight="400" fill="#4A4A4F">darunter Schock-Würfe (1-1-X) und Straßen</text></svg>
