<svg viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bierjunge Prinzip: Zwei Kontrahenten treten im Trinkduell gegeneinander an, ein neutraler Unparteiischer überwacht das Duell. Sieger ist, wer sein leeres Glas zuerst senkrecht abstellt."><title>Bierjunge – das Duell</title><desc>Zwei Kontrahenten treten im Trinkduell an, ein neutraler Unparteiischer überwacht es. Sieger ist, wer sein leeres Glas zuerst senkrecht auf den Tisch stellt.</desc><circle cx="130" cy="92" r="26" fill="#E1342B"/><text x="130" y="92" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="22">🍺</text><text x="130" y="138" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0E0E10">Spieler A</text><circle cx="470" cy="92" r="26" fill="#0E0E10"/><text x="470" y="92" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="22">🍺</text><text x="470" y="138" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0E0E10">Spieler B</text><circle cx="300" cy="60" r="22" fill="#FFF7E3" stroke="#0E0E10" stroke-width="1.6"/><text x="300" y="60" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="16">⚖️</text><text x="300" y="98" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0E0E10">Unparteiischer</text><line x1="162" y1="92" x2="262" y2="70" stroke="#4A4A4F" stroke-width="1.4" stroke-dasharray="5 4"/><line x1="438" y1="92" x2="338" y2="70" stroke="#4A4A4F" stroke-width="1.4" stroke-dasharray="5 4"/><line x1="170" y1="100" x2="430" y2="100" stroke="#E1342B" stroke-width="2"/><text x="300" y="150" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#E1342B">Trinkduell auf Zeit</text><text x="300" y="172" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#4A4A4F">Wer sein leeres Glas zuerst senkrecht abstellt, gewinnt.</text></svg>