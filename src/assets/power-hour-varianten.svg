<svg viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Power Hour Varianten im Vergleich: Power Half Hour mit 30 Shots in 30 Minuten, die klassische Power Hour mit 60 Shots in 60 Minuten und Centurion mit 100 Shots in 100 Minuten."><title>Power Hour Varianten: Half Hour, Power Hour, Centurion</title><desc>Drei Varianten im Vergleich: Power Half Hour 30 Minuten und 30 Shots, Power Hour 60 Minuten und 60 Shots, Centurion 100 Minuten und 100 Shots.</desc><rect x="14" y="30" width="180" height="150" rx="14" fill="#fff" stroke="#0E0E10" stroke-width="1.6"/><text x="104" y="58" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#0E0E10">Power Half Hour</text><circle cx="104" cy="110" r="34" fill="#FFF7E3" stroke="#E1342B" stroke-width="3"/><text x="104" y="108" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="22" font-weight="700" fill="#E1342B">30</text><text x="104" y="160" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#4A4A4F">30 Min · für Einsteiger</text><rect x="210" y="20" width="180" height="160" rx="14" fill="#fff" stroke="#E1342B" stroke-width="2.4"/><rect x="210" y="20" width="180" height="30" rx="14" fill="#E1342B"/><rect x="210" y="38" width="180" height="12" fill="#E1342B"/><text x="300" y="36" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="700" fill="#fff">Power Hour</text><circle cx="300" cy="110" r="38" fill="#FFF7E3" stroke="#E1342B" stroke-width="3"/><text x="300" y="108" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="26" font-weight="700" fill="#E1342B">60</text><text x="300" y="162" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#0E0E10">60 Min · der Klassiker</text><rect x="406" y="30" width="180" height="150" rx="14" fill="#fff" stroke="#0E0E10" stroke-width="1.6"/><text x="496" y="58" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#0E0E10">Centurion</text><circle cx="496" cy="110" r="34" fill="#0E0E10"/><text x="496" y="108" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="20" font-weight="700" fill="#fff">100</text><text x="496" y="160" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#4A4A4F">100 Min · für Profis</text></svg>