<svg viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Power Hour Prinzip: 60 Minuten lang trinkt jeder bei jedem Songwechsel einen Shot Bier. Das ergibt 60 Shots, also etwa 6 Flaschen Bier in einer Stunde."><title>Power Hour Prinzip</title><desc>Eine Stunde lang trinkt jeder beim Wechsel des Songs einen Shot Bier – jede Minute ein neuer Song. Das ergibt 60 Shots, rund 6 Flaschen Bier pro Person.</desc><circle cx="110" cy="100" r="74" fill="#fff" stroke="#0E0E10" stroke-width="2"/><circle cx="110" cy="100" r="74" fill="none" stroke="#E1342B" stroke-width="6" stroke-dasharray="6 6.7"/><text x="110" y="40" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" font-weight="700" fill="#4A4A4F">60</text><text x="170" y="100" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" font-weight="700" fill="#4A4A4F">15</text><text x="110" y="160" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" font-weight="700" fill="#4A4A4F">30</text><text x="50" y="100" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" font-weight="700" fill="#4A4A4F">45</text><line x1="110" y1="100" x2="110" y2="52" stroke="#0E0E10" stroke-width="3" stroke-linecap="round"/><line x1="110" y1="100" x2="146" y2="118" stroke="#E1342B" stroke-width="3" stroke-linecap="round"/><circle cx="110" cy="100" r="5" fill="#0E0E10"/><text x="110" y="100" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="0" fill="#0E0E10"></text><text x="300" y="56" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#0E0E10">1 Song = 1 Minute = 1 Shot</text><rect x="232" y="78" width="60" height="46" rx="8" fill="#FFF7E3" stroke="#0E0E10" stroke-width="1.6"/><text x="262" y="101" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="20" font-weight="700" fill="#E1342B">60</text><text x="262" y="138" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="400" fill="#4A4A4F">Minuten</text><text x="312" y="101" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="18" font-weight="700" fill="#0E0E10">×</text><rect x="332" y="78" width="60" height="46" rx="8" fill="#FFF7E3" stroke="#0E0E10" stroke-width="1.6"/><text x="362" y="101" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="20" font-weight="700" fill="#E1342B">1</text><text x="362" y="138" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="400" fill="#4A4A4F">Shot (4 cl)</text><text x="412" y="101" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="18" font-weight="700" fill="#0E0E10">=</text><rect x="432" y="78" width="120" height="46" rx="8" fill="#0E0E10"/><text x="492" y="98" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="15" font-weight="700" fill="#fff">60 Shots</text><text x="492" y="138" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="400" fill="#4A4A4F">≈ 6 Flaschen Bier</text><text x="392" y="172" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#4A4A4F">Tipp: Mit Wasser-Shots oder kleineren Mengen bleibt es länger lustig.</text></svg>