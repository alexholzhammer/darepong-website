ight="90" rx="12" fill="#fff" stroke="#0E0E10" stroke-width="1.6"/><circle cx="432" cy="50" r="16" fill="#E1342B"/><text x="432" y="50" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="17" font-weight="700" fill="#fff">3</text><text x="456" y="44" text-anchor="start" dominant-baseline="central" font-family="sans-serif" font-size="15" font-weight="700" fill="#0E0E10">Busfahren</text><text x="456" y="66" text-anchor="start" dominant-baseline="central" font-family="sans-serif" font-size="11" font-weight="400" fill="#4A4A4F">Solo-Finale</text></svg>
