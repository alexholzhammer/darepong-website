<svg viewBox="0 0 600 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Vergleich Flunkyball und Bierball: Bei Flunkyball steht eine Zielflasche in der Mitte und das werfende Team trinkt nach einem Treffer. Bei Bierball hat jedes Team eine eigene Flasche und das getroffene Team retten muss, während die Gegner trinken."><title>Flunkyball vs. Bierball im Vergleich</title><desc>Flunkyball: eine Zielflasche in der Mitte, Team wirft abwechselnd, Treffer = trinken bis Stopp. Bierball: jedes Team hat eine eigene Flasche, beide werfen gleichzeitig, Treffer = Gegner trinkt.</desc><rect x="12" y="14" width="272" height="194" rx="14" fill="#fff" stroke="#0E0E10" stroke-width="1.6"/><rect x="12" y="14" width="272" height="38" rx="14" fill="#E1342B"/><rect x="12" y="38" width="272" height="14" fill="#E1342B"/><text x="148" y="34" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="15" font-weight="700" fill="#fff">Flunkyball</text><text x="34" y="80" font-family="sans-serif" font-size="12" font-weight="700" fill="#0E0E10">1 Zielflasche in der Mitte</text><text x="34" y="108" font-family="sans-serif" font-size="12" font-weight="700" fill="#0E0E10">Teams werfen abwechselnd</text><text x="34" y="136" font-family="sans-serif" font-size="12" font-weight="700" fill="#0E0E10">Treffer = eigenes Team trinkt</text><text x="34" y="164" font-family="sans-serif" font-size="12" font-weight="700" fill="#0E0E10">10–15 m Abstand, viel Platz</text><text x="34" y="192" font-family="sans-serif" font-size="12" font-weight="700" fill="#0E0E10">3–6 Spieler pro Team</text><rect x="316" y="14" width="272" height="194" rx="14" fill="#fff" stroke="#0E0E10" stroke-width="1.6"/><rect x="316" y="14" width="272" height="38" rx="14" fill="#0E0E10"/><rect x="316" y="38" width="272" height="14" fill="#0E0E10"/><text x="452" y="34" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="15" font-weight="700" fill="#fff">Bierball</text><text x="338" y="80" font-family="sans-serif" font-size="12" font-weight="700" fill="#0E0E10">Jedes Team hat eigene Flasche</text><text x="338" y="108" font-family="sans-serif" font-size="12" font-weight="700" fill="#0E0E10">Beide werfen gleichzeitig</text><text x="338" y="136" font-family="sans-serif" font-size="12" font-weight="700" fill="#0E0E10">Treffer = Gegner trinkt</text><text x="338" y="164" font-family="sans-serif" font-size="12" font-weight="700" fill="#0E0E10">Kürzerer Abstand, schneller</text><text x="338" y="192" font-family="sans-serif" font-size="12" font-weight="700" fill="#0E0E10">Meist 2 vs 2</text><circle cx="300" cy="111" r="22" fill="#FFF7E3" stroke="#0E0E10" stroke-width="1.6"/><text x="300" y="111" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="700" fill="#0E0E10">VS</text></svg>