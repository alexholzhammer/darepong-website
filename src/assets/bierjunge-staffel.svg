<svg viewBox="0 0 600 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bierjunge Staffel-Variante: Zwei gleich große Teams stehen sich gegenüber und trinken der Reihe nach auf ex. Sobald ein Glas den Tisch berührt, startet der nächste Spieler im Team."><title>Bierjunge – die Staffel-Variante</title><desc>Zwei gleich große Teams treten an. Jeder trinkt der Reihe nach auf ex; sobald das Glas des Trinkenden den Tisch berührt, startet der nächste Spieler. Das schnellere Team gewinnt.</desc><text x="70" y="34" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#E1342B">Team A</text><g fill="#E1342B"><circle cx="70" cy="64" r="13"/><circle cx="70" cy="98" r="13"/><circle cx="70" cy="132" r="13"/></g><text x="530" y="34" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0E0E10">Team B</text><g fill="#0E0E10"><circle cx="530" cy="64" r="13"/><circle cx="530" cy="98" r="13"/><circle cx="530" cy="132" r="13"/></g><g font-family="sans-serif" font-size="18"><text x="120" y="64" dominant-baseline="central">🍺</text><text x="120" y="98" dominant-baseline="central">🍺</text><text x="120" y="132" dominant-baseline="central">🍺</text><text x="464" y="64" dominant-baseline="central" text-anchor="end">🍺</text><text x="464" y="98" dominant-baseline="central" text-anchor="end">🍺</text><text x="464" y="132" dominant-baseline="central" text-anchor="end">🍺</text></g><text x="300" y="84" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0E0E10">Reihum auf ex</text><text x="300" y="106" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#4A4A4F">Glas berührt Tisch →</text><text x="300" y="122" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#4A4A4F">Nächster startet</text><text x="300" y="160" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#E1342B">Schnelleres Team gewinnt</text></svg>