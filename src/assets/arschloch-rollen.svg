<svg viewBox="0 0 600 190" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Arschloch Rollen und Kartentausch: Der König sitzt oben, das Arschloch unten. Vor jeder neuen Runde gibt das Arschloch seine besten Karten an den König und trinkt, der König gibt unliebsame Karten zurück."><title>Arschloch – Rollen &amp; Kartentausch</title><desc>Nach jeder Runde gibt es eine Rangordnung vom König bis zum Arschloch. Vor der nächsten Runde gibt das Arschloch seine besten Karten an den König und trinkt; der König gibt dafür unliebsame Karten zurück.</desc><g font-family="sans-serif"><rect x="40" y="24" width="220" height="30" rx="8" fill="#2E7D32"/><text x="56" y="39" dominant-baseline="central" font-size="13" font-weight="700" fill="#fff">👑 König</text><rect x="40" y="60" width="220" height="28" rx="8" fill="#fff" stroke="#0E0E10" stroke-width="1.4"/><text x="56" y="74" dominant-baseline="central" font-size="12" font-weight="700" fill="#0E0E10">Vize-König</text><rect x="40" y="94" width="220" height="28" rx="8" fill="#fff" stroke="#0E0E10" stroke-width="1.4"/><text x="56" y="108" dominant-baseline="central" font-size="12" font-weight="700" fill="#0E0E10">Bürger</text><rect x="40" y="128" width="220" height="28" rx="8" fill="#fff" stroke="#0E0E10" stroke-width="1.4"/><text x="56" y="142" dominant-baseline="central" font-size="12" font-weight="700" fill="#0E0E10">Vize-Arschloch</text><rect x="40" y="162" width="220" height="28" rx="8" fill="#E1342B"/><text x="56" y="176" dominant-baseline="central" font-size="13" font-weight="700" fill="#fff">💩 Arschloch – trinkt</text></g><path d="M280 176 C 360 176 360 39 436 39" fill="none" stroke="#E1342B" stroke-width="2.4" stroke-dasharray="6 5"/><polyline points="430,34 438,39 430,44" fill="none" stroke="#E1342B" stroke-width="2.4"/><text x="360" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#E1342B">beste Karten</text><path d="M436 60 C 372 80 372 150 300 156" fill="none" stroke="#4A4A4F" stroke-width="2" stroke-dasharray="5 4"/><polyline points="306,151 299,157 305,162" fill="none" stroke="#4A4A4F" stroke-width="2"/><text x="372" y="96" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#4A4A4F">Restkarten</text><g font-family="sans-serif"><rect x="452" y="28" width="120" height="60" rx="10" fill="#fff" stroke="#2E7D32" stroke-width="2"/><text x="512" y="50" text-anchor="middle" font-size="12" font-weight="700" fill="#2E7D32">König</text><text x="512" y="70" text-anchor="middle" font-size="10" fill="#4A4A4F">bekommt Top-Karten</text><rect x="452" y="128" width="120" height="60" rx="10" fill="#fff" stroke="#E1342B" stroke-width="2"/><text x="512" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#E1342B">Arschloch</text><text x="512" y="170" text-anchor="middle" font-size="10" fill="#4A4A4F">gibt ab &amp; trinkt</text></g></svg>