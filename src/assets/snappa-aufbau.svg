<svg viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Snappa Aufbau: ein langer Tisch, zwei Teams sitzen sich gegenüber, in der Mitte stehen Becher. Der Würfel wird über den Tisch zur gegnerischen Seite geschnippt, die Gegner versuchen ihn nach dem Aufprall zu fangen.">
  <title>Snappa – Aufbau am Tisch</title>
  <desc>Beim Snappa sitzen sich zwei Teams an einem langen Tisch gegenüber. In der Tischmitte stehen Becher. Ein Spieler schnippt oder rollt den Würfel über den Tisch zur gegnerischen Seite; die Gegner versuchen, ihn nach dem ersten Aufprall zu fangen. Bestimmte Augenzahlen geben Punkte oder lösen Trink-Aktionen aus.</desc>
  <text x="300" y="26" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#0E0E10">Snappa – Aufbau (Team gegen Team)</text>
  <!-- table -->
  <rect x="80" y="70" width="440" height="160" rx="12" fill="#E5E1D8" stroke="#0E0E10" stroke-width="2"/>
  <!-- center cups -->
  <g>
    <rect x="276" y="128" width="22" height="18" rx="4" fill="#fff" stroke="#0E0E10" stroke-width="1.5"/>
    <rect x="302" y="128" width="22" height="18" rx="4" fill="#fff" stroke="#0E0E10" stroke-width="1.5"/>
    <rect x="289" y="152" width="22" height="18" rx="4" fill="#fff" stroke="#0E0E10" stroke-width="1.5"/>
  </g>
  <!-- Team A bottom -->
  <g font-family="sans-serif" font-size="12" font-weight="700">
    <circle cx="200" cy="255" r="16" fill="#F2B829" stroke="#0E0E10" stroke-width="2"/><text x="200" y="259" text-anchor="middle" fill="#0E0E10">A1</text>
    <circle cx="400" cy="255" r="16" fill="#F2B829" stroke="#0E0E10" stroke-width="2"/><text x="400" y="259" text-anchor="middle" fill="#0E0E10">A2</text>
    <!-- Team B top -->
    <circle cx="200" cy="45" r="16" fill="#C62828" stroke="#0E0E10" stroke-width="2"/><text x="200" y="49" text-anchor="middle" fill="#fff">B1</text>
    <circle cx="400" cy="45" r="16" fill="#C62828" stroke="#0E0E10" stroke-width="2"/><text x="400" y="49" text-anchor="middle" fill="#fff">B2</text>
  </g>
  <!-- dice + throw direction A1 -> B side -->
  <rect x="190" y="196" width="20" height="20" rx="4" fill="#0E0E10"/><circle cx="200" cy="206" r="3" fill="#fff"/>
  <path d="M210 200 Q300 150 400 96" fill="none" stroke="#0E0E10" stroke-width="2" stroke-dasharray="2 4" marker-end="url(#a2)"/>
  <defs><marker id="a2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#0E0E10"/></marker></defs>
  <text x="300" y="205" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6B6B72">Becher in der Mitte</text>
</svg>
