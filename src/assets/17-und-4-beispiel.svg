<svg viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Beispielblätter bei 17 und 4: Ass plus König ergibt genau 21, der beste Wurf. Neun plus Acht ergibt 17 und ist ein gutes Blatt. König plus Dame plus Vier ergibt 24 und ist überkauft."><title>17 und 4 Beispielblätter</title><desc>Beispiele: Ass und König ergeben genau 21 (bestes Blatt), Neun und Acht ergeben 17 (gutes Blatt), König, Dame und Vier ergeben 24 und sind überkauft.</desc><rect x="12" y="20" width="186" height="160" rx="14" fill="#fff" stroke="#2E7D32" stroke-width="2.4"/><text x="105" y="42" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#2E7D32">Bestes Blatt</text><rect x="48" y="56" width="48" height="68" rx="6" fill="#fff" stroke="#0E0E10" stroke-width="1.4"/><text x="72" y="92" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="24" font-weight="700" fill="#E1342B">A</text><rect x="110" y="56" width="48" height="68" rx="6" fill="#fff" stroke="#0E0E10" stroke-width="1.4"/><text x="134" y="92" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="24" font-weight="700" fill="#0E0E10">K</text><text x="105" y="150" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#0E0E10">11 + 10 = 21</text><text x="105" y="170" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#4A4A4F">unschlagbar</text><rect x="207" y="20" width="186" height="160" rx="14" fill="#fff" stroke="#0E0E10" stroke-width="1.6"/><text x="300" y="42" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0E0E10">Gutes Blatt</text><rect x="243" y="56" width="48" height="68" rx="6" fill="#fff" stroke="#0E0E10" stroke-width="1.4"/><text x="267" y="92" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="24" font-weight="700" fill="#E1342B">9</text><rect x="305" y="56" width="48" height="68" rx="6" fill="#fff" stroke="#0E0E10" stroke-width="1.4"/><text x="329" y="92" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="24" font-weight="700" fill="#0E0E10">8</text><text x="300" y="150" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#0E0E10">9 + 8 = 17</text><text x="300" y="170" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#4A4A4F">halten lohnt sich</text><rect x="402" y="20" width="186" height="160" rx="14" fill="#fff" stroke="#E1342B" stroke-width="2.4"/><text x="495" y="42" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#E1342B">Überkauft</text><rect x="430" y="56" width="40" height="60" rx="6" fill="#fff" stroke="#0E0E10" stroke-width="1.4"/><text x="450" y="88" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="20" font-weight="700" fill="#0E0E10">K</text><rect x="475" y="56" width="40" height="60" rx="6" fill="#fff" stroke="#0E0E10" stroke-width="1.4"/><text x="495" y="88" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="20" font-weight="700" fill="#0E0E10">D</text><rect x="520" y="56" width="40" height="60" rx="6" fill="#fff" stroke="#0E0E10" stroke-width="1.4"/><text x="540" y="88" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="20" font-weight="700" fill="#E1342B">4</text><text x="495" y="150" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#E1342B">10 + 10 + 4 = 24</text><text x="495" y="170" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#4A4A4F">über 21 → verloren</text></svg>