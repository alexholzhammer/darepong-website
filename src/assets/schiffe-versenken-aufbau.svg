<svg viewBox="0 0 600 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schiffe versenken Aufbau: ein Raster mit Spalten A bis F und Zeilen 1 bis 6, in das die eigenen Schiffe eingezeichnet werden. Ein roter Treffer bedeutet, der getroffene Spieler trinkt, ein Kreis steht für Wasser."><title>Schiffe versenken Trinkspiel – Aufbau</title><desc>Ein Raster mit Spalten A bis F und Zeilen 1 bis 6, in das jeder Spieler verdeckt seine Schiffe einzeichnet. Ein roter Treffer bedeutet, der getroffene Spieler trinkt; ein Kreis steht für Wasser.</desc><g stroke="#0E0E10" stroke-width="1.4"><line x1="60" y1="40" x2="60" y2="208"/><line x1="88" y1="40" x2="88" y2="208"/><line x1="116" y1="40" x2="116" y2="208"/><line x1="144" y1="40" x2="144" y2="208"/><line x1="172" y1="40" x2="172" y2="208"/><line x1="200" y1="40" x2="200" y2="208"/><line x1="228" y1="40" x2="228" y2="208"/><line x1="60" y1="40" x2="228" y2="40"/><line x1="60" y1="68" x2="228" y2="68"/><line x1="60" y1="96" x2="228" y2="96"/><line x1="60" y1="124" x2="228" y2="124"/><line x1="60" y1="152" x2="228" y2="152"/><line x1="60" y1="180" x2="228" y2="180"/><line x1="60" y1="208" x2="228" y2="208"/></g><g font-family="sans-serif" font-size="11" font-weight="700" fill="#4A4A4F" text-anchor="middle"><text x="74" y="32">A</text><text x="102" y="32">B</text><text x="130" y="32">C</text><text x="158" y="32">D</text><text x="186" y="32">E</text><text x="214" y="32">F</text><text x="50" y="58">1</text><text x="50" y="86">2</text><text x="50" y="114">3</text><text x="50" y="142">4</text><text x="50" y="170">5</text><text x="50" y="198">6</text></g><rect x="89" y="41" width="83" height="26" fill="#7A7A7A"/><rect x="173" y="97" width="26" height="54" fill="#7A7A7A"/><g stroke="#E1342B" stroke-width="3" stroke-linecap="round"><line x1="123" y1="47" x2="137" y2="61"/><line x1="137" y1="47" x2="123" y2="61"/></g><circle cx="102" cy="166" r="7" fill="none" stroke="#1F6FB2" stroke-width="2"/><g font-family="sans-serif"><rect x="300" y="58" width="22" height="22" fill="#7A7A7A"/><text x="332" y="69" dominant-baseline="central" font-size="13" font-weight="700" fill="#0E0E10">Schiff (verdeckt)</text><g stroke="#E1342B" stroke-width="3" stroke-linecap="round"><line x1="303" y1="103" x2="319" y2="119"/><line x1="319" y1="103" x2="303" y2="119"/></g><text x="332" y="111" dominant-baseline="central" font-size="13" font-weight="700" fill="#0E0E10">Treffer → trinken</text><circle cx="311" cy="155" r="9" fill="none" stroke="#1F6FB2" stroke-width="2"/><text x="332" y="155" dominant-baseline="central" font-size="13" font-weight="700" fill="#0E0E10">Wasser (daneben)</text></g></svg>