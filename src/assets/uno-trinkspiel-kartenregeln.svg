<svg viewBox="0 0 600 210" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="UNO Trinkspiel Kartenregeln: Zieh-Zwei bedeutet zwei Schlucke, Zieh-Vier bedeutet vier Schlucke, Retour lässt den Nachbarn trinken und Aussetzen bedeutet, dass der Übersprungene trinkt."><title>UNO Trinkspiel – Kartenregeln</title><desc>Typische Trinkregeln: Zieh Zwei = zwei Schlucke, Zieh Vier = vier Schlucke, Retour = der Nachbar trinkt, Aussetzen = der übersprungene Spieler trinkt.</desc><rect x="34" y="24" width="118" height="128" rx="12" fill="#E1342B" stroke="#0E0E10" stroke-width="1.6"/><ellipse cx="93" cy="88" rx="44" ry="54" fill="#fff"/><text x="93" y="88" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="30" font-weight="700" fill="#E1342B">+2</text><text x="93" y="172" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0E0E10">Zieh Zwei</text><text x="93" y="191" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="400" fill="#4A4A4F">2 Schlucke</text><rect x="172" y="24" width="118" height="128" rx="12" fill="#0E0E10" stroke="#0E0E10" stroke-width="1.6"/><ellipse cx="231" cy="88" rx="44" ry="54" fill="#fff"/><text x="231" y="88" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="28" font-weight="700" fill="#0E0E10">+4</text><text x="231" y="172" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0E0E10">Zieh Vier</text><text x="231" y="191" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="400" fill="#4A4A4F">4 Schlucke + Farbwahl</text><rect x="310" y="24" width="118" height="128" rx="12" fill="#2E7D32" stroke="#0E0E10" stroke-width="1.6"/><ellipse cx="369" cy="88" rx="44" ry="54" fill="#fff"/><text x="369" y="88" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="30" font-weight="700" fill="#2E7D32">⇄</text><text x="369" y="172" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0E0E10">Retour</text><text x="369" y="191" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="400" fill="#4A4A4F">Nachbar trinkt</text><rect x="448" y="24" width="118" height="128" rx="12" fill="#1F6FB2" stroke="#0E0E10" stroke-width="1.6"/><ellipse cx="507" cy="88" rx="44" ry="54" fill="#fff"/><text x="507" y="88" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="30" font-weight="700" fill="#1F6FB2">⊘</text><text x="507" y="172" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0E0E10">Aussetzen</text><text x="507" y="191" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="400" fill="#4A4A4F">Übersprungener trinkt</text></svg>