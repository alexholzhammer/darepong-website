<svg viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Drei Trink-Roulette Varianten: Zahlen-Roulette mit nummerierten Gläsern, Aufgaben-Roulette mit Challenges auf den Feldern und Russisch Roulette mit einem Shot der besonders stark ist."><title>Trink-Roulette Varianten</title><desc>Drei beliebte Varianten: Zahlen-Roulette mit nummerierten Gläsern, Aufgaben-Roulette mit Challenges statt Zahlen und Russisch Roulette, bei dem ein Glas besonders stark ist.</desc><rect x="14" y="26" width="180" height="156" rx="14" fill="#fff" stroke="#0E0E10" stroke-width="1.6"/><circle cx="104" cy="78" r="26" fill="#FFF7E3" stroke="#E1342B" stroke-width="3"/><line x1="104" y1="78" x2="104" y2="56" stroke="#0E0E10" stroke-width="2.5" stroke-linecap="round"/><circle cx="104" cy="78" r="3.5" fill="#0E0E10"/><text x="104" y="126" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0E0E10">Zahlen-Roulette</text><text x="104" y="150" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#4A4A4F">Nummerierte Gläser –</text><text x="104" y="165" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#4A4A4F">der Klassiker</text><rect x="210" y="26" width="180" height="156" rx="14" fill="#fff" stroke="#0E0E10" stroke-width="1.6"/><rect x="276" y="56" width="48" height="44" rx="8" fill="#FFF7E3" stroke="#E1342B" stroke-width="2.4"/><text x="300" y="80" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="20" font-weight="700" fill="#E1342B">?</text><text x="300" y="126" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0E0E10">Aufgaben-Roulette</text><text x="300" y="150" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#4A4A4F">Challenges statt Zahlen –</text><text x="300" y="165" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#4A4A4F">trinken oder Aufgabe</text><rect x="406" y="26" width="180" height="156" rx="14" fill="#fff" stroke="#0E0E10" stroke-width="1.6"/><path d="M487 56 h18 l-3 40 h-12 z" fill="#0E0E10"/><rect x="491" y="78" width="10" height="18" fill="#E1342B"/><text x="496" y="126" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0E0E10">Russisch Roulette</text><text x="496" y="150" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#4A4A4F">Ein Glas ist besonders</text><text x="496" y="165" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#4A4A4F">stark – wer trifft, trinkt</text></svg>