<svg viewBox="0 0 600 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Arschloch Kartenrangfolge: Von niedrig nach hoch gilt 3, dann aufsteigend bis Bube, Dame, König, Ass und als höchste Karte die 2."><title>Arschloch – die Kartenrangfolge</title><desc>Die übliche Rangfolge von niedrig nach hoch: 3 ist am schwächsten, danach aufsteigend bis Bube, Dame, König, Ass – und die 2 ist die höchste Karte.</desc><text x="40" y="40" text-anchor="start" font-family="sans-serif" font-size="12" font-weight="700" fill="#4A4A4F">niedrig</text><text x="560" y="40" text-anchor="end" font-family="sans-serif" font-size="12" font-weight="700" fill="#4A4A4F">hoch</text><line x1="40" y1="52" x2="560" y2="52" stroke="#0E0E10" stroke-width="1.6"/><polyline points="552,47 560,52 552,57" fill="none" stroke="#0E0E10" stroke-width="1.6"/><g font-family="sans-serif" font-size="18" font-weight="700">
<rect x="44" y="66" width="44" height="64" rx="6" fill="#fff" stroke="#0E0E10" stroke-width="1.4"/><text x="66" y="100" text-anchor="middle" dominant-baseline="central" fill="#0E0E10">3</text>
<text x="104" y="100" text-anchor="middle" dominant-baseline="central" fill="#4A4A4F" font-size="16">…</text>
<rect x="120" y="66" width="44" height="64" rx="6" fill="#fff" stroke="#0E0E10" stroke-width="1.4"/><text x="142" y="100" text-anchor="middle" dominant-baseline="central" fill="#0E0E10">10</text>
<rect x="172" y="66" width="44" height="64" rx="6" fill="#fff" stroke="#0E0E10" stroke-width="1.4"/><text x="194" y="100" text-anchor="middle" dominant-baseline="central" fill="#0E0E10">B</text>
<rect x="224" y="66" width="44" height="64" rx="6" fill="#fff" stroke="#0E0E10" stroke-width="1.4"/><text x="246" y="100" text-anchor="middle" dominant-baseline="central" fill="#E1342B">D</text>
<rect x="276" y="66" width="44" height="64" rx="6" fill="#fff" stroke="#0E0E10" stroke-width="1.4"/><text x="298" y="100" text-anchor="middle" dominant-baseline="central" fill="#0E0E10">K</text>
<rect x="328" y="66" width="44" height="64" rx="6" fill="#fff" stroke="#0E0E10" stroke-width="1.4"/><text x="350" y="100" text-anchor="middle" dominant-baseline="central" fill="#E1342B">A</text>
<rect x="396" y="60" width="52" height="74" rx="7" fill="#fff" stroke="#E1342B" stroke-width="2.4"/><text x="422" y="97" text-anchor="middle" dominant-baseline="central" fill="#E1342B" font-size="22">2</text>
</g><text x="422" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#E1342B">höchste Karte</text><text x="510" y="100" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" font-weight="400" fill="#4A4A4F">Hausregel<tspan x="510" dy="15">festlegen</tspan></text></svg>